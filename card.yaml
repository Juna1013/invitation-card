# カードに記載する文言と、クラス別の配色をまとめた設定ファイル。
# カードの文言を変更するときは、このファイルだけを編集する。

# 全カード共通の情報
event:
  title: 勝田一中 同窓会
  subtitle: 令和3年度 卒業生一同
  date: "2027-01-11" # 日時は1行で「2027.01.11 17:00 - 19:00」と表示される
  start_time: "17:00"
  end_time: "19:00"

# 項目名（ラベル）と敬称
labels:
  guest_no: GUEST NO.
  recipient: 宛名
  datetime: 日時
  class: クラス
  honorific: 様 # 宛名の末尾に付く

# 当時のクラス（名簿の値）→ 配色（プリセット名 または #rrggbb）
class_colors:
  3年1組: 白
  3年2組: 黄
  3年3組: 緑
  3年4組: 朱
  3年5組: 橙
  3年6組: 青
  3年7組: 紫
  3年8組: ピンク
  教職員: 黒
