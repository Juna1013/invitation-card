# カードに記載する文言と、クラス別の配色をまとめた設定ファイル。
# カードの文言を変更するときは、このファイルだけを編集する。

# 全カード共通の情報
event:
  title: 勝田一中 同窓会
  subtitle: 令和3年度 卒業生一同
  date: "2027-01-10" # 日時は1行で「2027.01.10 17:00 - 19:00」と表示される
  start_time: "17:00"
  end_time: "19:00"
  venue: ホテルクリスタルパレス # 会場名（カードの「場所」欄に表示）
  # 地図リンク（任意）。画像にはリンクを埋め込めないため、生成時に表示される URL をメール本文に貼る
  map_url: https://www.google.com/maps/search/?api=1&query=%E3%83%9B%E3%83%86%E3%83%AB%E3%82%AF%E3%83%AA%E3%82%B9%E3%82%BF%E3%83%AB%E3%83%91%E3%83%AC%E3%82%B9+%E3%81%B2%E3%81%9F%E3%81%A1%E3%81%AA%E3%81%8B%E5%B8%82

# 項目名（ラベル）と敬称
labels:
  guest_no: GUEST NO.
  recipient: 宛名
  datetime: 日時
  class: 区分
  venue: 場所
  honorific: 様 # 宛名の末尾に付く

# 名簿の区分（当時のクラスなど。名簿の値）→ 配色（プリセット名 または #rrggbb）
class_colors:
  3年1組: 白練
  3年2組: 鬱金色
  3年3組: 常磐緑
  3年4組: 茜色
  3年5組: 蜜柑色
  3年6組: 藍色
  3年7組: 江戸紫
  3年8組: 撫子色
  教職員等: 鉄黒

# 公開用の画像（SNS など）で伏せる語句 → 置き換え後。--public を付けたときだけ、タイトルとサブタイトルに適用される
# 例: npm run sample:public && npm run overview:public
public_masks:
  勝田一中: 〇〇〇〇
