# カードに記載する文言と、クラス別の配色をまとめた設定ファイル。
# カードの文言を変更するときは、このファイルだけを編集する。

# 全カード共通の情報
event:
  school: ○○中学校
  title: 成人式 同窓会
  year: 2027
  starts_at: "2027-01-11 18:00" # 表示は「1月11日(月) 18:00」の形式に変換される
  fee: 5,000円 # 省略または空にすると「会費」欄を表示しない

# 項目名（ラベル）と敬称
labels:
  guest_no: GUEST NO.
  recipient: 宛名
  datetime: 日時
  class: クラス
  fee: 会費
  honorific: 様 # 宛名の末尾に付く

# 当時のクラス（名簿の値）→ 配色（プリセット名 または #rrggbb）
class_colors:
  3年1組: 白
  3年2組: 黄
  3年3組: 緑
  3年4組: 朱
  3年5組: 橙
  3年6組: 青
  3年7組: 紫
  3年8組: ピンク
  教職員: 黒
